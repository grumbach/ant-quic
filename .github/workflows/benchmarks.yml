# Benchmarks - Performance testing, profiling, and regression detection
# Same-host merge-base gate (#291): never fail on mock benches, head-of-master
# artifacts, cross-runner baselines, or raw mean deltas that ignore Criterion CIs.

name: Benchmarks

on:
  push:
    branches: [master, main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "benches/**"
      - "scripts/ci/bench_gate.py"
      - "scripts/ci/test_bench_gate.py"
      - ".github/workflows/benchmarks.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "benches/**"
      - "scripts/ci/bench_gate.py"
      - "scripts/ci/test_bench_gate.py"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Baseline commit/tag to compare against (optional; default merge-base)'
        required: false
        type: string
      run_profiling:
        description: 'Run profiling (flamegraph, memory analysis)'
        type: boolean
        default: false
  schedule:
    # Run weekly to track performance over time
    - cron: '0 0 * * 0'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep Criterion runs bounded; gate quality comes from CIs + same-commit control.
  BENCH_CRITERION_ARGS: "--sample-size 40 --warm-up-time 1 --measurement-time 2"

# Required for posting comments on PRs
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Create fresh Criterion home
        run: |
          # Keep samples outside rust-cache's compiler target cleanup.
          criterion_home=$(mktemp -d "$RUNNER_TEMP/ant-quic-criterion.XXXXXXXX")
          echo "CRITERION_HOME=$criterion_home" >> "$GITHUB_ENV"
          mkdir -p "$criterion_home/sides"

      - name: Validate benchmark gate helpers
        run: python3 -m unittest discover -s scripts/ci -p 'test_bench_gate.py' -v

      - name: Resolve comparison commits
        id: refs
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Need full history so merge-base is the PR branch point, not a shallow tip.
            git fetch origin "${{ github.base_ref }}" --prune
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            git fetch origin "$HEAD_SHA" --prune
            MERGE_BASE="$(git merge-base "origin/${{ github.base_ref }}" "$HEAD_SHA")"
            echo "mode=pull_request" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "merge_base=$MERGE_BASE" >> "$GITHUB_OUTPUT"
            echo "Comparing merge-base $MERGE_BASE -> PR head $HEAD_SHA on this runner"
          else
            HEAD_SHA="${{ github.sha }}"
            echo "mode=single" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "merge_base=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "Single-side collection at $HEAD_SHA (no PR gate)"
          fi

      - name: Same-host gating benchmarks
        id: gate
        run: |
          set -euo pipefail
          GATE_ROOT="$CRITERION_HOME"
          # Persist helpers outside the worktree: we checkout merge-base/head below.
          cp -R scripts/ci "$GATE_ROOT/ci-scripts"
          GATE_PY="$GATE_ROOT/ci-scripts/bench_gate.py"
          GATING_BENCHES=(pqc_memory_pool_bench quic_benchmarks)

          write_unavailable() {
            local reason="$1"
            {
              echo "### Comparison unavailable"
              echo
              echo "$reason"
              echo
              echo "The job does not fail the PR for an unavailable comparison (#291)."
            } | tee "$GATE_ROOT/comparison-report.md" comparison-report.md
            echo "CRITERION_HOME=$GATE_ROOT" >> "$GITHUB_ENV"
            echo "regression_found=false" >> "$GITHUB_OUTPUT"
          }

          run_gating() {
            local label="$1"
            local side_home="$GATE_ROOT/$label"
            local out="$GATE_ROOT/sides/${label}.json"
            mkdir -p "$side_home" "$GATE_ROOT/sides"
            for bench in "${GATING_BENCHES[@]}"; do
              # Criterion paths are group/function ids, not cargo bench names — give
              # each suite its own CRITERION_HOME so collect can qualify by suite.
              local suite_home="$side_home/$bench"
              mkdir -p "$suite_home"
              export CRITERION_HOME="$suite_home"
              if ! cargo bench --bench "$bench" -- --save-baseline "$label" ${{ env.BENCH_CRITERION_ARGS }}; then
                echo "gating bench '$bench' failed at $(git rev-parse HEAD)"
                return 1
              fi
            done
            python3 "$GATE_PY" collect \
              --criterion-root "$side_home" \
              --suite pqc_memory_pool_bench \
              --suite quic_benchmarks \
              --label "$label" \
              --out "$out"
          }

          MODE="${{ steps.refs.outputs.mode }}"
          HEAD="${{ steps.refs.outputs.head }}"
          MERGE_BASE="${{ steps.refs.outputs.merge_base }}"

          if [ "$MODE" = "pull_request" ]; then
            echo "::group::Baseline at merge-base $MERGE_BASE"
            git checkout --force "$MERGE_BASE"
            if ! run_gating baseline; then
              write_unavailable "Baseline gating benches unavailable at merge-base \`$MERGE_BASE\`."
              exit 0
            fi
            echo "::endgroup::"

            echo "::group::Same-commit control at merge-base $MERGE_BASE"
            if ! run_gating control; then
              write_unavailable "Same-commit control run failed at merge-base \`$MERGE_BASE\`."
              exit 0
            fi
            echo "::endgroup::"

            echo "::group::Current at PR head $HEAD"
            git checkout --force "$HEAD"
            if ! run_gating current; then
              echo "Current gating benches failed at PR head $HEAD" >&2
              exit 1
            fi
            echo "::endgroup::"

            # connection_management and nat_traversal_performance remain in the
            # repo for local use but are intentionally not run or gated here
            # (issue #291 defect 1: they cannot observe this crate).

            set +e
            python3 "$GATE_PY" compare \
              --baseline "$GATE_ROOT/sides/baseline.json" \
              --control "$GATE_ROOT/sides/control.json" \
              --current "$GATE_ROOT/sides/current.json" \
              --report "$GATE_ROOT/comparison-report.md" \
              --merge-base "$MERGE_BASE" \
              --head "$HEAD" \
              --runner "${RUNNER_NAME:-$RUNNER_OS}"
            rc=$?
            set -e
            # Restore env for artifact upload paths.
            echo "CRITERION_HOME=$GATE_ROOT" >> "$GITHUB_ENV"
            # Check helper status before copying the report: compare may exit 2
            # without writing comparison-report.md (set -e would skip write_unavailable).
            if [ "$rc" -eq 1 ]; then
              cp "$GATE_ROOT/comparison-report.md" comparison-report.md
              echo "regression_found=true" >> "$GITHUB_OUTPUT"
            elif [ "$rc" -ne 0 ]; then
              write_unavailable "Gate helper failed with status $rc."
              exit 0
            else
              cp "$GATE_ROOT/comparison-report.md" comparison-report.md
              echo "regression_found=false" >> "$GITHUB_OUTPUT"
            fi
          else
            git checkout --force "$HEAD"
            if ! run_gating current; then
              echo "Gating benches failed at $HEAD" >&2
              exit 1
            fi
            {
              echo "# Benchmark Results"
              echo
              echo "Collected gating estimates at \`$HEAD\`."
              echo "PR comparison (merge-base + same-commit control) runs only on pull_request."
            } | tee "$GATE_ROOT/comparison-report.md" comparison-report.md
            cp "$GATE_ROOT/sides/current.json" benchmark-results.json
            echo "CRITERION_HOME=$GATE_ROOT" >> "$GITHUB_ENV"
            echo "regression_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload benchmark results
        if: always() && env.CRITERION_HOME != ''
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-results-${{ github.sha }}
          # Upload only the Criterion root. Mixing $RUNNER_TEMP paths with a
          # workspace file roots the artifact at their common ancestor, so
          # sides/current.json lands under _temp/... and history never finds it.
          # comparison-report.md is already written inside CRITERION_HOME.
          path: ${{ env.CRITERION_HOME }}/
          if-no-files-found: error

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let comment = '## Benchmark Results\n\n';
            if (fs.existsSync('comparison-report.md')) {
              comment += fs.readFileSync('comparison-report.md', 'utf8');
            } else {
              comment += 'Benchmark gate did not produce a comparison report.\n';
            }
            comment += '\n_Gate rules (#291): merge-base baseline, same-runner control, allowlisted ant-quic bench ids only, CI overlap required. Mock/non-observing benches never fail the job._\n';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('## Benchmark Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      - name: Fail if gating regression found
        if: steps.gate.outputs.regression_found == 'true'
        run: |
          echo "Gating performance regression detected (same-host merge-base + CI rule)."
          cat comparison-report.md
          exit 1

  profile:
    name: CPU Profiling
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_profiling == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install profiling tools
        run: |
          cargo install flamegraph --force || true
          sudo apt-get update
          sudo apt-get install -y linux-tools-common linux-tools-generic

      - name: Build with profiling
        run: cargo build --release

      - name: Generate flamegraph
        run: |
          sudo cargo flamegraph --root -- run --release --example simple_chat &
          FLAME_PID=$!
          sleep 10
          kill $FLAME_PID || true

      - name: Upload flamegraph
        uses: actions/upload-artifact@v5
        with:
          name: flamegraph
          path: flamegraph.svg

  memory-analysis:
    name: Memory Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_profiling == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Build test binary
        run: cargo build --release --example simple_chat

      - name: Run valgrind analysis
        run: |
          timeout 30s valgrind \
            --leak-check=full \
            --show-leak-kinds=all \
            --track-origins=yes \
            --log-file=valgrind.log \
            ./target/release/examples/simple_chat || true

      - name: Parse valgrind results
        run: |
          if [ -f valgrind.log ]; then
            echo "### Memory Analysis Results" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 50 valgrind.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload valgrind log
        uses: actions/upload-artifact@v5
        with:
          name: valgrind-log
          path: valgrind.log
        if: always()

  benchmark-history:
    name: Track History
    runs-on: ubuntu-latest
    # Allow this job to fail - benchmark history is optional and may fail on forks
    continue-on-error: true
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: benchmark
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download current results
        uses: actions/download-artifact@v5
        with:
          name: benchmark-results-${{ github.sha }}
          path: downloaded-benchmarks

      - name: Update benchmark history
        run: |
          mkdir -p .benchmarks
          # Prefer the gating current side map when present.
          if [ -f downloaded-benchmarks/sides/current.json ]; then
            cp downloaded-benchmarks/sides/current.json \
              .benchmarks/results-$(date +%Y%m%d-%H%M%S)-${{ github.sha }}.json
          elif [ -f downloaded-benchmarks/benchmark-results.json ]; then
            cp downloaded-benchmarks/benchmark-results.json \
              .benchmarks/results-$(date +%Y%m%d-%H%M%S)-${{ github.sha }}.json
          else
            echo "::error::benchmark-history: expected sides/current.json (or benchmark-results.json) under downloaded-benchmarks; artifact layout is broken"
            find downloaded-benchmarks -maxdepth 4 -type f | head -50 || true
            exit 1
          fi

          # Keep only last 50 results
          ls -t .benchmarks/results-*.json | tail -n +51 | xargs rm -f || true

      - name: Commit benchmark history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update benchmark history [skip ci]"
          file_pattern: ".benchmarks/*.json"
          branch: benchmark-history
          create_branch: true
          push_options: '--force'
